<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GymBuddy AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <!-- Moving Gym Background -->
    <div class="gym-background">
        <div class="gym-slide slide-1"></div>
        <div class="gym-slide slide-2"></div>
        <div class="gym-slide slide-3"></div>
    </div>

    <!-- Dark Overlay -->
    <div class="gym-overlay"></div>

    <!-- Login Content -->
    <main class="login-container">

        <!-- Logo / Title -->
        <div class="login-brand">
            <div class="login-logo">GYM</div>

            <h1>GymBuddy <span>AI</span></h1>

            <p class="login-tagline">
                Find your perfect workout partner.
            </p>
        </div>

        <!-- Motivational Quote -->
        <div class="quote-container">
            <p class="quote quote-1">
                “Train together. Stay motivated.”
            </p>

            <p class="quote quote-2">
                “Every workout is better with a buddy.”
            </p>

            <p class="quote quote-3">
                “Your goals. Your pace. Your buddy.”
            </p>

            <p class="quote quote-4">
                “Connect. Train. Improve.”
            </p>
        </div>

        <!-- Login Card -->
        <div class="login-card">

            <h2>Welcome Back!</h2>

            <p class="login-subtitle">
                Log in to continue your GymBuddy journey.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginEmail">Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    LOGIN
                </button>

            </form>

            <p id="loginMessage" class="login-message"></p>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
