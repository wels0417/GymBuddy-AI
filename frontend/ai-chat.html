
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBuddy AI Chat</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ai-chat-container {
            max-width: 720px;
            margin: 40px auto;
            padding: 20px;
        }

        #chat-messages {
            height: 420px;
            overflow-y: auto;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .chat-message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user-message {
            background: #dbeafe;
            color: #172554;
            margin-left: 15%;
        }

        .ai-message {
            background: #f3f4f6;
            color: #111827;
            margin-right: 15%;
        }

        #chat-form {
            display: flex;
            gap: 8px;
        }

        #chat-input {
            flex: 1;
            min-width: 0;
            padding: 12px;
        }

        #chat-form button {
            padding: 12px 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="ai-chat-container">
        <h1>GymBuddy AI Assistant</h1>
        <p>Ask questions about workouts, exercises, and fitness goals.</p>

        <div id="chat-messages" aria-live="polite">
            <div class="chat-message ai-message">
                Hi! I'm your GymBuddy AI assistant.
                What would you like help with today?
            </div>
        </div>

        <form id="chat-form">
            <input
                id="chat-input"
                type="text"
                placeholder="Ask me a fitness question..."
                maxlength="2000"
                autocomplete="off"
                required
            >
            <button id="send-button" type="submit">Send</button>
        </form>

        <p id="chat-status" role="status"></p>
    </main>

    <script src="js/ai-chat.js"></script>
</body>
</html>
