<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout Preferences - GymBuddy AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Workout Preferences</h1>

    <p>
        Tell us about your workout preferences.
    </p>

    <form id="preferencesForm">

        <label>Preferred Workout</label>

        <select id="preferred_workout" required>
            <option value="">Select workout</option>
            <option value="Strength Training">Strength Training</option>
            <option value="Cardio">Cardio</option>
            <option value="HIIT">HIIT</option>
            <option value="Yoga">Yoga</option>
            <option value="Mixed">Mixed</option>
        </select>


        <label>Preferred Intensity</label>

        <select id="preferred_intensity" required>
            <option value="">Select intensity</option>
            <option value="Light">Light</option>
            <option value="Moderate">Moderate</option>
            <option value="High">High</option>
        </select>


        <label>Preferred Duration (minutes)</label>

        <input
            type="number"
            id="preferred_duration"
            min="15"
            max="180"
            placeholder="Example: 60"
            required
        >


        <label>Preferred Location</label>

        <select id="preferred_location" required>
            <option value="">Select location</option>
            <option value="Gym">Gym</option>
            <option value="Home">Home</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Any">Any</option>
        </select>


        <label>Partner Preference</label>

        <select id="partner_preference" required>
            <option value="">Select preference</option>
            <option value="Any">Any</option>
            <option value="Same Experience Level">
                Same Experience Level
            </option>
            <option value="Similar Fitness Goal">
                Similar Fitness Goal
            </option>
        </select>


        <button type="submit" class="primary-button">
            Save Preferences
        </button>

    </form>


    <!-- IMPORTANT -->
    <script src="js/app.js"></script>

</body>

</html>
